org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 8.12/8.13 leaves the integrated R8 resource shrinker opt-in. This is the
# same optimized shrinking pipeline that AGP 9 enables by default, without
# coupling a release-size improvement to AGP 9's separate built-in-Kotlin
# migration. It only affects minified builds, where app/build.gradle.kts already
# enables both R8 and resource shrinking.
android.r8.optimizedResourceShrinking=true
kotlin.code.style=official
