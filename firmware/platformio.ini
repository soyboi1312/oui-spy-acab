; ACAB - All Cameras Are Beacons
; Firmware builds from one shared core (lib/acab_core):
;   pio run -e oui-spy       app-controlled scanner w/ BLE GATT service
;   pio run -e mesh-detect   scanner that uplinks over a Heltec V3 Meshtastic node
;   pio run -e beacon-board  dual-radio v2 product (companion nRF52840 feeds BLE over UART)
;
; Hardware: Seeed XIAO ESP32-S3 (Colonel Panic OUI-Spy / Mesh-Detect).

[platform]
; pinned to match the base oui-spy project

[env]
; exact pin = the resolved set every field test and signed OTA image was built from (PlatformIO
; has no lockfile, so a caret float would let a fresh machine ship an untested core over OTA)
platform        = espressif32@6.13.0
board           = seeed_xiao_esp32s3
framework       = arduino
monitor_speed   = 115200
upload_speed    = 921600
extra_scripts   = post:tools/stamp_app_desc.py

board_build.partitions = default_8MB.csv
board_build.flash_mode = qio
board_build.f_cpu       = 240000000L

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; roomy ATT MTU: the status + rich drone JSON outgrew the old 247 (see NOTIFY_MAX in acab_ble_service)
    -DCONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=512
    ; more msys1 mbufs so a 512-MTU notify + the offline-replay drain don't starve the pool (see
    ; DRAIN_MBUF_MIN back-pressure in acab_ble_service); default block count is small
    -DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=20
    ; OTA finish runs the ECDSA-P256 signature verify (mbedtls_pk_verify) inside the GATT write
    ; callback, i.e. ON the NimBLE host task. That task's default stack is 4096 B, and ECP point
    ; math overflows it -> a "Double exception" stack smash right at otaFinish (see otaDoFinish in
    ; ota_update.cpp). Give the host task real headroom so the verify + Update.end fit. RAM is cheap
    ; on the S3; a bricked update is not. MUST be present in the RUNNING image for its OTA to finish.
    -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=12288
    ; Authenticate the version embedded in esp_app_desc and enforce the persisted healthy-version
    ; floor. stamp_app_desc.py stamps ACAB_FW_VERSION and recomputes the image checksum/hash before
    ; release signing.
    -DACAB_OTA_VERSION_FLOOR
    ; BLE ADDRESS PRIVACY: REMOVED FROM THE SHARED BUILD 2026-08-02. Do not put it back here.
    ;
    ; -DCONFIG_BT_NIMBLE_HOST_BASED_PRIVACY=1 is genuinely required BY ACAB_BLE_PRIVACY (without it
    ; setOwnAddrType(RPA) compiles away and the board advertises its fixed factory address while
    ; every line of source reads as though privacy is on , proven on hardware 2026-08-01, two boots
    ; printed the same e8:3d:c1 Espressif OUI). But ACAB_BLE_PRIVACY is 0 and no env sets it to 1,
    ; so in every shipping build the flag was buying NOTHING while still changing the BLE stack
    ; underneath us. Two concrete costs, both for a feature that is switched off:
    ;
    ;   1. IT SWITCHES PEER-RPA RESOLUTION FROM THE CONTROLLER TO A HOST-SIDE RESOLVER.
    ;      ble_hs_pvcy.c gates the controller path (set_resolve_enabled / clear_entries) behind the
    ;      #else of this symbol, and ble_hs_pvcy_add_entry_hci then calls ble_hs_resolv_list_add()
    ;      instead of sending HCI Add-To-Resolving-List. The host resolver reads peer_dev_rec[],
    ;      which is only WRITTEN at bond creation (ble_sm.c:577, itself inside the same #if).
    ;      NOTE, because this was raised as a ship-blocker and the prediction did NOT reproduce:
    ;      the argument was that bonds created by 2.0.2 (no flag) would be unresolvable after an
    ;      OTA to a flag-carrying build. Measured 2026-08-02 on board e8:3d:c1:fa:ff:59 - a bond
    ;      created against a clean HEAD build of the PUBLISHED 2.0.2, then flashed over with the
    ;      flag build, reconnected with enc_change status=0, encrypted=1 bonded=1 in ~1s, twice.
    ;      So it is not the field-bricking upgrade it looked like on paper. Removed anyway: an
    ;      inert flag has no business rerouting the pairing stack, and the second cost is real.
    ;   2. IT ENABLES AN UNBOUNDED ARRAY WRITE. peer_dev_rec[] is BLE_RESOLV_LIST_SIZE =
    ;      MAX_BONDS+1 = 9 entries (ble_hs_resolv.c:36,43), and ble_rpa_resolv_add_peer_rec()
    ;      writes peer_dev_rec[ble_store_num_peer_dev_rec] then increments, with NO bounds check -
    ;      its own doc comment promises a BLE_HS_ESTORE_CAP return that the code never implements,
    ;      and the ble_sm.c caller does not guard either. Its BSS neighbour is g_ble_hs_resolv_list.
    ;      Raising MAX_BONDS to 8 put that within reach at the 10th distinct pairing. The array
    ;      does not exist at all with this flag off.
    ;
    ; If address privacy is ever revived, add BOTH flags together in a dedicated env, never here.
    ; acab_ble_service.cpp #errors if ACAB_BLE_PRIVACY is on without this symbol, so they cannot
    ; drift apart in the direction that silently disables privacy.
    ; Peripheral-only, and exactly one client at a time. Every connection-scoped global in
    ; acab_ble_service.cpp is single-instance (gConnected, gPeerMtu, the ignore/watch stages, the
    ; OTA session), so a second concurrent client was never supported anyway. Pinning the pool at 1
    ; also closes the advertising-supervisor race deterministically: NimBLE clears adv_active before
    ; it dispatches BLE_GAP_EVENT_CONNECT, so there is a window where the supervisor sees "not
    ; advertising, not connected" and restarts advertising on a board that is mid-connect. With one
    ; connection slot ble_gap_adv_validate refuses the start outright instead of leaving the board
    ; connectable to a second peer for the rest of the session.
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    ; Bond slots. NimBLE's default is 3 and it EVICTS THE OLDEST silently on overflow, with nothing
    ; on the wire to say a bond vanished. Three is enough to make bench results depend on how many
    ; phones happened to touch a board earlier that day, and enough that a household with a couple
    ; of phones plus a spare could quietly lose one. Raised because a bond disappearing with no
    ; cause is exactly the class of failure that cost this project a day.
    -DCONFIG_BT_NIMBLE_MAX_BONDS=8
    ; CCCD slots, and NOT independent of MAX_BONDS above: without this line, raising the bond count
    ; is mostly self-defeating. The service exposes three NOTIFY characteristics (detection, status,
    ; OTA) and both apps subscribe to all three on connect, so a fully-subscribed bond persists 3
    ; CCCD records. At NimBLE's default of 8 the store saturates after 2 bonds and the 9th record
    ; overflows, and ble_store_util_status_rr handles a CCCD overflow by calling
    ; ble_gap_unpair_oldest_except(), i.e. IT DELETES A BOND. That is the same silent bond loss
    ; MAX_BONDS was raised to prevent, arriving through a door where the bond table still looks
    ; half empty. Chain, traced in the pinned 1.4.3 rather than assumed:
    ;   this flag -> esp_nimble_cfg.h:667 -> MYNEWT_VAL_BLE_STORE_MAX_CCCDS -> ble_store_config.c:396
    ; Keep it at 4x MAX_BONDS: three notifies per bond, plus headroom for a fourth.
    -DCONFIG_BT_NIMBLE_MAX_CCCDS=32
    ; Field-capture builds ONLY: add -DACAB_ACTIVE_SCAN to pull scan responses (device
    ; names etc). It transmits SCAN_REQs carrying our address = RF-loud + fingerprintable.
    ; NEVER ship it. (Same flag exists in nrf-ble-scan for the co-processor.)
    ; -DACAB_ACTIVE_SCAN

; Shared across both builds. NimBLE drives scan + (oui-spy) GATT server.
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3

; -----------------------------------------------------------------------------
; OUI-Spy: app-controlled. Compiles src/beacon-board/* only.
; -----------------------------------------------------------------------------
[env:oui-spy]
build_src_filter = -<*> +<beacon-board/>
lib_deps =
    ${env.lib_deps}
    bblanchon/ArduinoJson@7.4.3

; -----------------------------------------------------------------------------
; Mesh-Detect: meshtastic uplink. Compiles src/mesh-detect/* only.
; Hand-rolls the Meshtastic protobuf, so no extra deps beyond the core.
; -----------------------------------------------------------------------------
[env:mesh-detect]
build_src_filter = -<*> +<mesh-detect/>
lib_deps =
    ${env.lib_deps}
    bblanchon/ArduinoJson@7.4.3

; -----------------------------------------------------------------------------
; Mesh-Detect (private channel): identical to mesh-detect but pinned to channel
; index 1 (PROTO transport). Powers the web flasher's private-channel button so
; people can flash the private build without PlatformIO. The Heltec still needs
; its acab channel + PROTO Serial Module set up to match (see docs/mesh-setup.md).
; -----------------------------------------------------------------------------
[env:mesh-detect-ch1]
extends = env:mesh-detect
build_flags =
    ${env.build_flags}
    -DACAB_MESH_CHANNEL=1

; -----------------------------------------------------------------------------
; Beacon Board (dual-radio): the v2 two-board product. Same app build as oui-spy
; (shares src/beacon-board/ via `extends`); BLE detection is fed over UART by a
; companion XIAO nRF52840 (see firmware/nrf-ble-scan/) that scans BLE at full
; duty. This ESP32-S3 stops its own BLE scan and runs WiFi + the app GATT only.
; For the v2 two-board prototype.   pio run -e beacon-board
; -----------------------------------------------------------------------------
[env:beacon-board]
extends = env:oui-spy   ; inherits the shared src/beacon-board/ core + ArduinoJson dep
build_flags =
    ${env.build_flags}
    -DACAB_DUAL_RADIO
    ; v2 carrier board: buzzer on D8/GPIO7 (right edge, next to the piezo, and not
    ; a strapping pin like D2/GPIO3). Single-board oui-spy keeps the D2 default.
    -DACAB_BUZZER_PIN=7
    ; v2 product version. The default lives in acab_version.h; this line pins the beacon-board's
    ; own build number so OTA's version-guard has an explicit value to compare an incoming image
    ; against. Bump this line for a beacon-board release.
    ; KEEP EVERY DOTTED FIELD UNDER 1024. ota_update.cpp verPack() packs the version into three
    ; 10-BIT fields and CLAMPS anything larger to 1023, so a four-digit patch number is invisible
    ; to the OTA gate and cannot ship over the air. Bump the MINOR when the patch field runs out.
    ; 2.0.3 (2026-08-02): the BLE link round, plus two detection additions.
    ;   DETECTION: Google Find Hub / FMDN separated trackers (Eddystone service data 0xFEAA,
    ;   frame type 0x41 ONLY; the near-owner 0x40 form is deliberately unmatched). Netcam
    ;   OUIs 43 -> 59 (Ezviz 14, Lorex, Swann); TP-Link/Tapo + Foscam rejected on the
    ;   record. BLE LINK: CONFIG_BT_NIMBLE_MAX_CCCDS=32 so the 8 bond slots
    ;   are real - at NimBLE's default of 8 the store saturated after 2 fully-subscribed bonds and
    ;   a CCCD overflow calls ble_gap_unpair_oldest_except(), i.e. it DELETES A BOND. Bond slots
    ;   3 -> 8. Firmware version no longer advertised in the scan response. Advertising re-arms
    ;   after GAP preemption. New GAP/pairing serial diagnostics. Address privacy implemented and
    ;   left OFF (works on air + on Android, breaks iOS connect); see ACAB_BLE_PRIVACY.
    ; 2.0.2 (2026-08-01): everything in 2.0.1 plus the review round it did not survive. Network
    ;   cameras got their own buzzer pattern and now honour their own opt-in; the glasses
    ;   classifier scores all three surfaces instead of returning on the first; the WiFi Axon
    ;   detail strings match the apps' exact-match contract; the boot banner names the board.
    ; 2.0.1 (2026-07-31, PUBLISHED via soyboi.tech cd0f3b5): glasses 0x01AB un-gated on ground truth + member-UUID/HeyCyan surfaces,
    ; Ring/Wyze/eufy camera OUIs, Axon OUI matched on WiFi. History below is the 2.0.0 cut.
    ; 2.0.5 (2026-08-10): the two-review hardening round; see the changelog block in
    ; acab_version.h (cid on the wire, FALCON self-attestation gate, hot-path mutex hoist,
    ; mesh-detect pairing gate, ASCII-only version validation, fail-closed version packing).
    ; 2.0.0: the v2 launch build. Folds in the pre-release fix train proven on hardware 2026-07-23:
    ; mutex-protected + flush-first/redundant nRF DFU and power-off UART relays, and the nrfv
    ; re-query so a lost boot handshake can't leave the co-processor update un-offerable.
    ; (The PRE-RECUT 2.0.1-2.0.5 numbers were bench-only OTA test cuts from before the clean
    ; 2.0.0 re-cut; nothing shipped to users under THOSE. This 2.0.5 is a real release and
    ; does ship - the collision is nominal only, the bench cuts never left the bench.)
    ; 2.0.6 (2026-08-21): i-PRO/Getac camera + activation-accessory capture candidates;
    ; production classification remains gated on a ground-truthed passive signature.
    -DACAB_FW_VERSION=\"2.0.6\"
    ; NO SOFT-CROSS ENV, deliberately. main.cpp carries -DACAB_UART_SOFT_CROSS for the earlier
    ; "flipped" carrier layout, whose nRF UART runs RX=D6/TX=D7 instead of the rev-A copper cross.
    ; A stock build on a flipped board gives nRF adv=0 fwd=0: BLE detection silently dead, WiFi
    ; still fine, no error anywhere. Confirmed on the bench 2026-08-02. There is no env for it
    ; because NO FLIPPED BOARDS ARE IN THE FIELD, only one retired bench unit, so shipping a second
    ; variant would be maintaining a build nobody can receive. If flipped hardware ever ships, this
    ; is the flag, and the symptom to look for is a healthy-looking board detecting nothing on BLE.

; -----------------------------------------------------------------------------
; beacon-board REV-B: identical to beacon-board plus the rev-B-only hardware features.
; The 250 rev-A boards MUST keep running the plain [env:beacon-board] image.
;
; ACAB_FORCE_REV_B=1 is the ONE flag that actually turns rev-B behaviour on (main.cpp:329). It is
; NOT optional and it is NOT belt-and-braces with ACAB_REV_DETECT:
;   - the runtime D0 probe (ACAB_REV_DETECT) senses the R3/R4 divider, and that divider sits ACROSS
;     VBUS - so it can only return a verdict while USB is actually plugged in. A rev-B BATTERY board
;     running on its cell reads ~0mV, fails the mean>1500mV test, leaves gBoardRevB at 0, and the
;     boot gate then reads the momentary button's idle-HIGH as "switch off" and parks the unit. A
;     rev-B board that has never once been plugged in would therefore never come up at all.
;     DO NOT re-justify this by "R3/R4 are battery-SKU-only" - that scoping is superseded. BOM.md
;     populates R1-R4 on EVERY rev-B board, slim included (the two rev-B populations differ only in
;     C1), so the divider is fitted regardless. The limit is VBUS being absent, not the resistors.
;     ACAB_REV_DETECT is in any case not defined by any env today, so the probe never runs.
;   - so the compile-time force is the only mechanism that covers both SKUs in every power state.
;     Flash rev-B boards with THIS env and rev-A boards with [env:beacon-board]; that is the whole
;     discriminator.
; This env used to carry -DACAB_BTN_POWER and -DACAB_VBUS_SENSE_PIN=1. Both were DEAD: no source
; file ever read either macro (the real switches are ACAB_FORCE_REV_B / ACAB_REV_DETECT, and
; kVbusSensePin is hardcoded in main.cpp). The image they produced reported "rev-A" and would have
; parked a rev-B board ~3s after every boot. Removed 2026-07-29 rather than left as documentation
; that looks like configuration. What they described is still true of the hardware:
;   SW1 is an EVQ-P7 momentary side BUTTON, not an SS12D00G4 slide - same D10 sense line, but the
;   semantics move into firmware (hold to power on, hold ~1.5s to power off, cold boot with nothing
;   held = stays off). An R3/R4 divider off the S3 5V castellation -> D0/GPIO1 gives an
;   authoritative USB-plugged signal on the battery SKU.
;   pio run -e beacon-board-revb
; -----------------------------------------------------------------------------
[env:beacon-board-revb]
extends = env:beacon-board
build_flags =
    ${env:beacon-board.build_flags}
    -DACAB_FORCE_REV_B=1
    ; rev-B is drawn by build_pcb.py with the nRF FLIPPED (rot 0), so its UART runs straight in
    ; copper and the S3 must cross in software. rev-A (the 250 shipping boards) crosses in copper
    ; and is the firmware default, so this line is what keeps the two revisions apart.
    -DACAB_UART_SOFT_CROSS
    ; Distinct OTA identity. Without this BOTH revisions report "beacon board 2.0.0" and nothing in
    ; the manifest/app path can steer the right image at the right board - a rev-A unit handed the
    ; rev-B image parks after every boot and is USB-recovery only. Keep the numeric version in step
    ; with beacon-board above; the label is what makes the two images distinguishable.
    ; single-quoted because the value CONTAINS SPACES: the bare \"...\" form the version flag above
    ; uses gets word-split by the shell and fails with "missing terminating \" character".
    -DACAB_FW_LABEL='"beacon board rev-B"'

; -----------------------------------------------------------------------------
; Field-capture build (ground truth, NOT a product build).   pio run -e beacon-board-capture
;
; REV-A BOARDS ONLY: this extends [env:beacon-board], the rev-A image, which on rev-B hardware
; parks ~3 s after boot (no ACAB_FORCE_REV_B) and cannot hear the nRF (no ACAB_UART_SOFT_CROSS).
; Rev-B boards take [env:beacon-board-revb-capture] below.
;
; For standing next to a camera you can SEE and recording everything the board hears, so a
; signature can be argued from evidence instead of a guess. Pair it with tools/capture-log.py,
; which timestamps the serial stream and lets you type ground-truth markers into the same file.
;
; What each flag contributes:
;   ACAB_DIAG       one line per LIVE BLE advert, matched or not: MAC, RSSI, decoded local name
;                   (AD 0x08/0x09) and the raw payload. This is the SHARED ingest path, so on the
;                   dual-radio board it covers the nRF-forwarded adverts too, not just the S3's.
;   ACAB_DIAG_WIFI  every beacon / probe-response as BSSID + SSID + RSSI. It ALSO forces
;                   WIFI_PROMIS_FILTER_MASK_DATA on unconditionally, so you get the data-frame
;                   firehose WITHOUT having to switch on the network-camera opt-in first.
;   ACAB_CAPTURE_BUILD  two jobs. It is the interlock that unlocks the acab_scanner.h #error
;                   guarding ACAB_ACTIVE_SCAN / ACAB_BENCH_NO_SLEEP, so this env is the one place
;                   those can be added on purpose. It ALSO now gates capture-only output that no
;                   shipping build may carry: every probe request (not just already-known Falcon
;                   OUIs, which made the build circular - it could only find signatures we already
;                   had), and the diagnostic OUI watchlist, which logs frame type on both the mgmt
;                   and data paths without ever producing a detection. It also enables the exact-
;                   width ALPR candidate table: sourced MA-L, MA-M, MA-S and IAB prefixes are
;                   annotated on BLE and every WiFi address field, but never classified.
;
; Stays passive toward nearby targets. Do not add -DACAB_ACTIVE_SCAN for a first pass: it makes
; the board send active scan requests to those devices instead of only hearing their broadcasts.
; The encrypted phone control link is separate. On the dual-radio board the BLE scan lives on the
; nRF, so it would need its own capture build to change anything. Only reach for active scanning if
; a name looks scan-response-only.
;
; The resulting log contains nearby MACs, SSIDs and raw payloads, i.e. other people's devices.
; Keep it private, and reflash a shipping env when you are done.
; -----------------------------------------------------------------------------
[env:beacon-board-capture]
extends = env:beacon-board
build_flags =
    ${env:beacon-board.build_flags}
    -DACAB_CAPTURE_BUILD
    -DACAB_DIAG
    -DACAB_DIAG_WIFI

; -----------------------------------------------------------------------------
; Rev-B field-capture build. Composed, not copied: capture is exactly "base env + the three
; flags", so extending [env:beacon-board-revb] inherits the rev-B power gate (ACAB_FORCE_REV_B)
; and the UART cross (ACAB_UART_SOFT_CROSS) that the rev-A capture image lacks. Same rules as
; the capture env above: passive first pass, the log is private, reflash a shipping env when
; done. Inheriting the rev-B ACAB_FW_LABEL is fine - capture images are USB-flashed and never
; enter the OTA manifest.   pio run -e beacon-board-revb-capture
; -----------------------------------------------------------------------------
[env:beacon-board-revb-capture]
extends = env:beacon-board-revb
build_flags =
    ${env:beacon-board-revb.build_flags}
    -DACAB_CAPTURE_BUILD
    -DACAB_DIAG
    -DACAB_DIAG_WIFI

; -----------------------------------------------------------------------------
; ODID-Sim (bench test tool): fakes a Remote-ID-broadcasting drone. Compiles
; src/odid-sim/* only (a self-contained sketch + a local copy of the vendored
; OpenDroneID encoder, so we do NOT drag in the rest of lib/acab_core). Flash it
; onto a spare XIAO ESP32-S3 to exercise the OpenDroneID receiver end to end.
; NOT a product build.   pio run -e odid-sim
; -----------------------------------------------------------------------------
[env:odid-sim]
build_src_filter = -<*> +<odid-sim/>
; odid-sim MUST advertise from its PINNED static-random address (main.cpp ble_hs_id_set_rnd), so
; the receiver's pre-BasicID MAC keying does not move under it mid-session. Host-based privacy
; turns setOwnAddrType(BLE_OWN_ADDR_RANDOM) into ble_hs_pvcy_rpa_config(ENABLE_RPA), which
; OVERWRITES that pinned address with a generated RPA and rotates it every 900 s, silently
; breaking the one guarantee this bench tool exists to provide.
; Re-listed in full rather than ${env.build_flags} because PlatformIO cannot subtract a flag.
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=512
    -DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=20
    -DCONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE=12288
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
