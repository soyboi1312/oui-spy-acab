# XcodeGen project definition for the Beacons iOS app.
# Generate the Xcode project with:  xcodegen generate   (brew install xcodegen)
name: Beacons
options:
  bundleIdPrefix: tech.beacons
  deploymentTarget:
    iOS: "18.0"   # bumped from 17.0 for supplementalActivityFamilies (CarPlay Dashboard) + ControlWidget
  createIntermediateGroups: true

# Mark the project as reviewed for the current Xcode so it stops nagging
# "Update to recommended settings" (XcodeGen otherwise defaults this to 1430).
attributes:
  LastUpgradeCheck: "2660"
  LastSwiftUpdateCheck: "2660"

# Nordic's iOS DFU library, for updating the nRF52840 co-processor over BLE. The nRF runs the
# Adafruit/Seeed bootloader (LEGACY Nordic DFU, service 0x1530), which the library speaks. BSD-3.
# Product is `NordicDFU` in 4.x. import NordicDFU; drive it with DFUServiceInitiator.
packages:
  NordicDFU:
    url: https://github.com/NordicSemiconductor/IOS-DFU-Library
    from: "4.13.0"

settings:
  base:
    MARKETING_VERSION: "2.0.7"
    # The build number RESTARTS AT 0 for each new MARKETING_VERSION, and only climbs when a SECOND
    # build of the SAME version has to go up. App Store Connect requires the build to be unique
    # within a version string, NOT across the app, so 0 is always free on a version that has never
    # uploaded. Proven in the archive history: 2.0.0 climbed to build 34, then 2.0.2 (0) and
    # 2.0.3 (0) both uploaded clean. So the rule is: bump MARKETING_VERSION, set this back to 0.
    #
    # Leave "Automatically manage version and build number" UNCHECKED in Xcode's Distribute flow. If
    # Xcode manages it, it bumps the build at UPLOAD time and never writes it back here, so every
    # archive on disk reads the same stale number while TestFlight climbs, and a crash report can
    # then only be matched to its dSYM by UUID. Builds 7-14 were lost that way.
    #
    # DO NOT edit the build number in Xcode's General tab: the project is generated, so the edit is
    # clobbered by the next `xcodegen generate` AND it only touches the app target, leaving
    # BeaconsWidget behind -> "extension version must match parent app". Both targets read
    # $(CURRENT_PROJECT_VERSION), so setting it HERE and regenerating keeps them in lockstep.
    CURRENT_PROJECT_VERSION: "1"   # 2.0.7 (0) already uploaded 2026-09; (1) carries the locale fixes
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "49B9T69XPF"        # baked in so `xcodegen generate` keeps signing
    ENABLE_USER_SCRIPT_SANDBOXING: YES    # Xcode-recommended build setting
    # Xcode 26.6 "recommended settings" nag. The app has no String Catalog yet, so this is inert;
    # it lives here (not in the Xcode dialog) because the xcodeproj is regenerated from this file.
    STRING_CATALOG_GENERATE_SYMBOLS: YES

targets:
  Beacons:
    type: application
    platform: iOS
    sources:
      - Beacons
    dependencies:
      - target: BeaconsWidget
        embed: true
      - package: NordicDFU
        product: NordicDFU
    # App Group shared with the widget extension. The home-screen widget runs in its own
    # process and can't read app memory, so the app mirrors a tiny detection summary into
    # UserDefaults(suiteName: "group.tech.beacons.app") and the widget reads it. XcodeGen
    # generates the .entitlements file and wires CODE_SIGN_ENTITLEMENTS. NOTE: for a device
    # or TestFlight build the App Group capability must also exist on the provisioning
    # profile; automatic signing usually creates it on first archive, but confirm the group
    # id matches on both targets in the portal.
    entitlements:
      path: Beacons/Beacons.entitlements
      properties:
        com.apple.security.application-groups:
          - group.tech.beacons.app
    info:
      path: Beacons/Resources/Info.plist
      properties:
        CFBundleDisplayName: "beacons"
        # Drive version/build from the MARKETING_VERSION / CURRENT_PROJECT_VERSION
        # build settings (XcodeGen otherwise bakes a literal 1.0/1 into the plist,
        # which then wins because GENERATE_INFOPLIST_FILE is NO).
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Live Activity (Dynamic Island + Lock Screen detection counter, plus the
        # iOS 26 CarPlay Dashboard mirror). FrequentUpdates raises the update budget
        # for the BLE-driven count; the user can still disable it in Settings.
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        # App uses only standard/exempt encryption (BLE, HTTPS), declared so
        # TestFlight/App Store Connect stops asking for export compliance each build.
        ITSAppUsesNonExemptEncryption: false
        NSBluetoothAlwaysUsageDescription: "This app connects to your beacon over Bluetooth to receive detections."
        NSLocationWhenInUseUsageDescription: "Used to map and geotag detections, share your current location with your own beacon over encrypted Bluetooth, and keep Live Mode active in the background. Coordinates are not automatically uploaded; you choose whether to include them in an export or contribution."
        NSFocusStatusUsageDescription: "This app checks whether a Focus or Do Not Disturb is active so it can stay silent and skip the vibrate alert while you have one on."
        UIBackgroundModes:
          - bluetooth-central
          - location
        UIAppFonts:
          - SpaceGrotesk-Regular.ttf
          - SpaceGrotesk-Medium.ttf
          - SpaceGrotesk-Bold.ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-SemiBold.ttf
          - JetBrainsMono-Bold.ttf
        # Custom scheme so the Live Mode Live Activity (widgetURL beacons://log/new)
        # can deep-link into the Log tab. Handled in RootView's onOpenURL.
        CFBundleURLTypes:
          - CFBundleURLName: tech.beacons.app
            CFBundleURLSchemes:
              - beacons
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.beacons.app
        PRODUCT_NAME: Beacons
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # Logic tests for the pure model code. Today that is the follow-evidence parity fixtures, which
  # are the mechanism holding this app and the Android app to ONE set of thresholds: both sides
  # ship separate implementations of the same document, and a band boundary that lands differently
  # on each phone is invisible without them. Hosted by the app target rather than compiling the
  # model sources a second time, so the tests always exercise the code that actually ships.
  BeaconsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BeaconsTests
    dependencies:
      - target: Beacons
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.beacons.app.tests
        GENERATE_INFOPLIST_FILE: YES

  # Widget extension: hosts the Live Activity (Dynamic Island + Lock Screen counter).
  BeaconsWidget:
    type: app-extension
    platform: iOS
    sources:
      - BeaconsWidget
      - path: Beacons/Shared/DetectionActivityAttributes.swift
      - path: Beacons/Shared/DriveModeIntents.swift
      # Brand fonts for the Live Activity surfaces (Space Grotesk digits, JetBrains
      # Mono kickers). Same TTFs the app bundles; declared in UIAppFonts below.
      - path: Beacons/Resources/Fonts/SpaceGrotesk-Bold.ttf
      - path: Beacons/Resources/Fonts/JetBrainsMono-Medium.ttf
    # Same App Group as the app target, so the widget can read the shared detection summary.
    entitlements:
      path: BeaconsWidget/BeaconsWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.tech.beacons.app
    info:
      path: BeaconsWidget/Info.plist
      properties:
        CFBundleDisplayName: "beacons"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - SpaceGrotesk-Bold.ttf
          - JetBrainsMono-Medium.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.beacons.app.widget
        PRODUCT_NAME: BeaconsWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic

# Explicit SHARED scheme so archiving is reliable and survives `xcodegen generate`.
# Without this, Xcode auto-generates the scheme on open, and a regen (e.g. on a version
# bump) drops it, leaving "No Scheme" and a greyed-out Product > Archive.
schemes:
  Beacons:
    build:
      targets:
        Beacons: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BeaconsTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
